name: Build and notify Dispatch

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Dispatch deployment record id
        required: true

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Dispatch (started)
        continue-on-error: true
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          RUN_ID:        ${{ github.run_id }}
          SECRET:        ${{ secrets.DISPATCH_WEBHOOK_SECRET }}
        run: |
          body=$(jq -nc \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg github_run_id "$RUN_ID" \
            --arg status        started \
            '{deployment_id: $deployment_id, github_run_id: $github_run_id, status: $status}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          curl --fail-with-body \
               -X POST https://dispatch.freeland.tools/webhooks/deployments \
               -H "Content-Type: application/json" \
               -H "X-Dispatch-Signature: sha256=$sig" \
               --data "$body"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Write Rails master key
        run: echo -n "${{ secrets.RAILS_MASTER_KEY }}" > config/master.key

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ vars.APP_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Dispatch (success)
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          COMMIT_SHA:    ${{ github.sha }}
          RUN_ID:        ${{ github.run_id }}
          SECRET:        ${{ secrets.DISPATCH_WEBHOOK_SECRET }}
        run: |
          body=$(jq -nc \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg commit_sha    "$COMMIT_SHA" \
            --arg github_run_id "$RUN_ID" \
            --arg status        success \
            '{deployment_id: $deployment_id, commit_sha: $commit_sha, github_run_id: $github_run_id, status: $status}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          curl --fail-with-body \
               -X POST https://dispatch.freeland.tools/webhooks/deployments \
               -H "Content-Type: application/json" \
               -H "X-Dispatch-Signature: sha256=$sig" \
               --data "$body"

      - name: Notify Dispatch (failure)
        if: failure()
        env:
          DEPLOYMENT_ID: ${{ inputs.deployment_id }}
          COMMIT_SHA:    ${{ github.sha }}
          SECRET:        ${{ secrets.DISPATCH_WEBHOOK_SECRET }}
        run: |
          body=$(jq -nc \
            --arg deployment_id "$DEPLOYMENT_ID" \
            --arg commit_sha    "$COMMIT_SHA" \
            --arg status        failure \
            '{deployment_id: $deployment_id, commit_sha: $commit_sha, status: $status}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | awk '{print $2}')
          curl --fail-with-body \
               -X POST https://dispatch.freeland.tools/webhooks/deployments \
               -H "Content-Type: application/json" \
               -H "X-Dispatch-Signature: sha256=$sig" \
               --data "$body"
